version: "3.9"

services:
  db:
    image: postgres:16
    container_name: poko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poko_app
    ports:
      - "5432:5432"
    volumes:
      - poko-postgres-data:/var/lib/postgresql/data

volumes:
  poko-postgres-data:
